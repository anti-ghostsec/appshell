name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  formats:
    name: Formats and core (formats against Leaflet's Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Leaflet at the pinned commit
        run: |
          git clone -q https://github.com/anti-ghostsec/leaflet build/leaflet
          git -C build/leaflet checkout -q "$(tr -d '[:space:]' < apps/leaflet.commit)"
      - name: What the Python makes of the corpus
        run: python3 tools/formats_oracle.py build/leaflet build/oracle
      - name: Rust tests and the comparison
        run: cargo test -p leaflet-formats -p appshell-core --locked
        env:
          ORACLE_DIR: ${{ github.workspace }}/build/oracle

  windows:
    name: Windows (build, then Folio and Leaflet doing their jobs)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      APPSHELL_FOLIO_UI: ${{ github.workspace }}/build/folio/ui
      APPSHELL_LEAFLET_UI: ${{ github.workspace }}/build/leaflet/ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The apps at the pinned commits
        run: |
          for app in folio leaflet; do
            git clone -q https://github.com/anti-ghostsec/$app build/$app
            git -C build/$app checkout -q "$(tr -d '[:space:]' < apps/$app.commit)"
          done
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows-${{ hashFiles('Cargo.lock') }}
      - name: Test build
        run: cargo build --release -p appshell-windows --features selftest --locked
      - name: Test files
        run: |
          mkdir -p build/t/out
          printf 'hello from the test\n' > build/t/note.txt
          python build/leaflet/tests/fixtures.py build/t > /dev/null
      - name: Folio opens a file and saves an edit
        run: |
          export APPSHELL_TEST_SCRIPT="$PWD/tools/selftest/folio.js" APPSHELL_TEST_OUT="$PWD/build/t/folio.json"
          timeout 180 target/release/folio.exe "$(cygpath -w build/t/note.txt)" || { cat build/t/folio.json; exit 1; }
          cat build/t/folio.json; echo
          grep -q 'edited by the test' build/t/note.txt
      - name: Leaflet edits and saves a .docx, and exports it as a PDF
        if: success() || failure()
        run: |
          export APPSHELL_TEST_SCRIPT="$PWD/tools/selftest/leaflet-doc.js" APPSHELL_TEST_OUT="$PWD/build/t/doc.json"
          export APPSHELL_TEST_SAVE="$(cygpath -w build/t/out)"
          timeout 240 target/release/leaflet.exe "$(cygpath -w build/t/sample.docx)" || { cat build/t/doc.json; exit 1; }
          cat build/t/doc.json; echo
          python -c "
          import sys; sys.path.insert(0, 'build/leaflet'); import leaflet_formats as lf
          d = lf.load(open('build/t/sample.docx', 'rb').read(), 'docx')
          assert 'Edited by the test.' in lf.to_html(d), 'the edit is not in the saved file'
          pdf = open('build/t/out/sample.pdf', 'rb').read()
          assert pdf.startswith(b'%PDF'), 'the export is not a PDF'
          print('docx saved; exported PDF', len(pdf), 'bytes')
          "
      - name: Leaflet shows a PDF, turns a page and saves it as a new file
        if: success() || failure()
        run: |
          export APPSHELL_TEST_SCRIPT="$PWD/tools/selftest/leaflet-pdf.js" APPSHELL_TEST_OUT="$PWD/build/t/pdf.json"
          export APPSHELL_TEST_SAVE="$(cygpath -w build/t/out)"
          timeout 240 target/release/leaflet.exe "$(cygpath -w build/t/pages.pdf)" || { cat build/t/pdf.json; exit 1; }
          cat build/t/pdf.json; echo
          head -c 5 build/t/out/pages.pdf | grep -q '%PDF'
          ! cmp -s build/t/pages.pdf build/t/out/pages.pdf
      - name: No profile left behind
        if: success() || failure()
        run: |
          left=$(ls -d "$TEMP"/folio-webview-* "$TEMP"/leaflet-webview-* 2>/dev/null || true)
          if [ -n "$left" ]; then echo "left behind: $left"; exit 1; fi
      - name: Release build
        run: cargo build --release -p appshell-windows --locked
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/folio.exe target/release/leaflet.exe dist/
          cp LICENSE dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/

  android:
    name: Android (APKs, then Folio and Leaflet doing their jobs on an emulator)
    runs-on: ubuntu-latest
    env:
      APPSHELL_FOLIO_UI: ${{ github.workspace }}/build/folio/ui
      APPSHELL_LEAFLET_UI: ${{ github.workspace }}/build/leaflet/ui
      APPSHELL_TEST_ASSETS: ${{ github.workspace }}/build/android-test-assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The apps at the pinned commits
        run: |
          for app in folio leaflet; do
            git clone -q https://github.com/anti-ghostsec/$app build/$app
            git -C build/$app checkout -q "$(tr -d '[:space:]' < apps/$app.commit)"
          done
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-ndk
            target
          key: android-${{ hashFiles('Cargo.lock') }}
      - name: Rust for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          command -v cargo-ndk || cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 -o android/shell/src/main/jniLibs \
            build --release -p appshell-android --locked
          ls -la android/shell/src/main/jniLibs/*
      - name: Test files
        run: |
          mkdir -p build/android-test-assets/selftest
          cp tools/selftest/*.js build/android-test-assets/selftest/
          python3 build/leaflet/tests/fixtures.py build/android-test-assets/selftest > /dev/null
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"
      - name: APKs
        run: gradle -p android --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest
      - name: No network permission in either app
        run: |
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          for apk in android/*/build/outputs/apk/release/*.apk; do
            echo "$apk"; "$aapt" dump permissions "$apk"
            ! "$aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'
          done
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: On the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            gradle -p android --no-daemon connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
            mkdir -p dist/screens
            for p in app.folio:folio app.leaflet:leaflet-doc app.leaflet:leaflet-pdf; do adb exec-out run-as "${p%%:*}" cat "files/screens/${p#*:}.png" > "dist/screens/${p#*:}.png" || true; done
      - name: Package
        if: always()
        run: |
          mkdir -p dist
          ls -la dist/screens || true
          cp android/folio/build/outputs/apk/release/*.apk dist/folio.apk 2>/dev/null || true
          cp android/leaflet/build/outputs/apk/release/*.apk dist/leaflet.apk 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android
          path: dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: android-test-reports
          path: android/*/build/reports/
